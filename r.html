<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>ZekiRex — 이동 중</title>
<style>body{margin:0;background:#0F1B3D;color:#fff;font:18px/1.6 -apple-system,'Noto Sans KR',sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.c{max-width:520px;text-align:center}a{color:#F4A27E;font-weight:700}#go{display:none}</style>
<!--zx-seo-->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#000C24">
<!--/zx-seo-->
</head>
<body><div class="c"><p id="msg">이동 중…</p><p id="go"></p></div>
<script>
/* 2026-10-17 편지 링크 클릭 세기. 기록하는 것: 편지 id · 링크 번호 · 도착 도메인 · 시각. 메일 주소·쿠키 없음. */
(function(){
  var EP='https://script.google.com/macros/s/AKfycbx6WVS3oVKRtgoGWDHZrqp-rk5OEvBvodjFzIP4pl_g41OBy4_sPhZnEh5H8kureGeP/exec';
  var OK=['zekirex.com','x.com','twitter.com','youtube.com','youtu.be','buttondown.com'];
  var q=new URLSearchParams(location.search), u=q.get('u')||'', e=q.get('e')||'', n=q.get('n')||'';
  var url; try{url=new URL(u);}catch(_){url=null;}
  if(!url||url.protocol!=='https:'){document.getElementById('msg').textContent='링크 주소가 올바르지 않습니다.';return;}
  var h=url.hostname.replace(/^www\./,'');
  if(/^[A-Za-z0-9_-]{3,48}$/.test(e)&&/^[0-9]{1,3}$/.test(n)){
    try{var b=new URLSearchParams({a:'click',e:e,n:n,h:h}).toString();
      if(!(navigator.sendBeacon&&navigator.sendBeacon(EP,new Blob([b],{type:'application/x-www-form-urlencoded'}))))
        fetch(EP,{method:'POST',mode:'no-cors',keepalive:true,body:new URLSearchParams({a:'click',e:e,n:n,h:h})});}catch(_){}
  }
  var known=OK.some(function(d){return h===d||h.slice(-d.length-1)==='.'+d;});
  if(known){setTimeout(function(){location.replace(url.href);},120);return;}
  document.getElementById('msg').textContent='아래 주소로 이동합니다 · You are leaving ZekiRex for:';
  var g=document.getElementById('go'),a=document.createElement('a');a.href=url.href;a.rel='noopener nofollow';a.textContent=h+' →';g.appendChild(a);g.style.display='block';
})();
</script></body></html>
